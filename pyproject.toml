[project]
name = "vera"
version = "0.1.0"
description = "AI agent that reads raw Li-ion formation/grading tester exports, flags bad cells with evidence, grades every cell and writes a QC report. NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "openai>=1.50",
    "httpx>=0.27",
    "contree-sdk==0.3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "h5py>=3.11",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
